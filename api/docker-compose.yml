services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"   # Port MQTT tiêu chuẩn
      - "9001:9001"   # Port WebSocket
    volumes:
      - ../mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ../mosquitto/config/passwd:/mosquitto/config/passwd
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -u ${MQTT_USER:-admin} -P ${MQTT_PASSWORD:-admin12345} > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # InfluxDB — Database lưu dữ liệu time-series
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin12345}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-iot-org}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-smart-building}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Grafana — Dashboard hiển thị dữ liệu realtime
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Virtual Sensors
  virtual-sensor-room-01:
    build: ../virtual_sensor
    container_name: virtual-sensor-room-01
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-01
      - DEVICE_ID=sensor-room-01
      - PUBLISH_INTERVAL=${PUBLISH_INTERVAL:-5}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  virtual-sensor-room-02:
    build: ../virtual_sensor
    container_name: virtual-sensor-room-02
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-02
      - DEVICE_ID=sensor-room-02
      - PUBLISH_INTERVAL=${PUBLISH_INTERVAL:-5}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  virtual-sensor-room-03:
    build: ../virtual_sensor
    container_name: virtual-sensor-room-03
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-03
      - DEVICE_ID=sensor-room-03
      - PUBLISH_INTERVAL=${PUBLISH_INTERVAL:-5}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Virtual Actuators
  virtual-actuator-room-01:
    build: ../virtual_actuator
    container_name: virtual-actuator-room-01
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-01
      - DEVICE_ID=actuator-room-01
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  virtual-actuator-room-02:
    build: ../virtual_actuator
    container_name: virtual-actuator-room-02
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-02
      - DEVICE_ID=actuator-room-02
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  virtual-actuator-room-03:
    build: ../virtual_actuator
    container_name: virtual-actuator-room-03
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - ROOM_ID=room-03
      - DEVICE_ID=actuator-room-03
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # IoT Gateway
  iot-gateway:
    build: ../iot_gateway
    container_name: iot-gateway
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-iot-org}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-smart-building}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # Gateway REST API
  gateway-api:
    build: ./gateway_api
    container_name: gateway-api
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-my-super-secret-token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-iot-org}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-smart-building}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

# Docker Volumes — Lưu dữ liệu bền vững khi container restart
volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  grafana_data:
