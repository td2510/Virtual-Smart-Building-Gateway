apiVersion: 1
policies:
  - orgId: 1
    receiver: "Admin Webhook"
    group_by: ['grafana_folder', 'alertname']
rules:
  - orgId: 1
    name: "Smart Building Alerts"
    folder: "Gateway Alerts"
    interval: "1m"
    rules:
      - uid: "gateway-critical-event"
        title: "Critical Gateway Event Detected"
        condition: "A"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "influxdb_gateway"
            model:
              query: |-
                from(bucket: "smart-building")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r["_measurement"] == "gateway_events")
                  |> filter(fn: (r) => r["severity"] == "critical")
                  |> aggregateWindow(every: v.windowPeriod, fn: count, createEmpty: false)
                  |> yield(name: "count")
              refId: "A"
        noDataState: "OK"
        execErrState: "Error"
        for: "1m"
        annotations:
          summary: "A critical event occurred in the building"
          description: "Check the Gateway Events dashboard."
        labels:
          severity: "critical"
