# Mosquitto MQTT Broker Configuration
# Smart Building IoT Gateway

# Listener mặc định trên port 1883 (giao thức TCP tiêu chuẩn)
listener 1883

# Cho phép kết nối không cần đăng nhập (môi trường dev)
allow_anonymous true

# WebSocket listener trên port 9001 (để test bằng browser nếu cần)
listener 9001
protocol websockets

# Lưu dữ liệu để không mất khi container restart
persistence true
persistence_location /mosquitto/data/

# In log ra màn hình để dễ debug
log_dest stdout
log_type all
connection_messages true
